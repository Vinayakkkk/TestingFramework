name: Self-Healing CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  self-healing-test:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout Framework2
        uses: actions/checkout@v4

      - name: Checkout Self-Healing Plugin
        uses: actions/checkout@v4
        with:
          repository: Vinayakkkk/Self-Healing-Plugin
          path: self-healing-plugin

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build Self-Healing Plugin
        working-directory: self-healing-plugin
        run: |
          mvn --batch-mode clean install -DskipTests

      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Verify Environment
        run: |
          java -version
          mvn -version
          google-chrome --version

      - name: Run Self-Healing Test
        run: |
          mvn --batch-mode clean test \
            -Dtest=LoginTest \
            -Dheadless=true \
            -Dai.enabled=false

      - name: Upload Healing Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-reports
          path: |
            reports/
            target/surefire-reports/
          if-no-files-found: ignore
