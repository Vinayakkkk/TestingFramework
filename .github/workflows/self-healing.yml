name: Self-Healing Framework CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  self-healing-test:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Framework2 (Where the test runs)
      - name: Checkout Framework2
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Required to push auto-repaired code back

      # 2. Checkout the Plugin Repository
      - name: Checkout Self-Healing Plugin
        uses: actions/checkout@v4
        with:
          repository: Vinayakkkk/Self-Healing-Plugin 
          path: plugin-source 
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}

      # 3. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 4. Compile the Plugin Locally on the GitHub Runner
      # This replaces Nexus! It installs the .jar directly into the runner's .m2 cache
      - name: Build and Install Plugin
        run: |
          cd plugin-source
          mvn clean install -DskipTests

      # 5. Setup Chrome
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 6. Run ONLY the healing test
      # Enabled the AI and Source Repair so the bot actually fixes the code!
      - name: Run Self-Healing Login Test
        run: |
          mvn --batch-mode clean test \
            -Dtest=LoginTest \
            -Dheadless=true \
            -Dhealing.ai.enabled=true \
            -Dhealing.source.repair.enabled=true \
            -Dhealing.report.enabled=true

      # 7. Auto-Commit Healed Page Objects
      - name: Commit and Push Healed Page Objects
        if: always()
        run: |
          git config --global user.name "Healing-Bot"
          git config --global user.email "bot@selfhealing.com"
          
          # Stage the modified Page Objects
          git add src/main/java/pages/*.java
          
          # Check for changes and commit
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-repair: AI self-healing updated Page Objects"
            git push
          else
            echo "No Page Objects required healing."
          fi

      # 8. Upload healing reports & Dashboard
      - name: Upload Healing Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-reports
          path: |
            reports/
            target/surefire-reports/
          if-no-files-found: ignore

      # 9. Upload execution logs
      - name: Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: |
            *.log
            target/*.log
          if-no-files-found: ignore
