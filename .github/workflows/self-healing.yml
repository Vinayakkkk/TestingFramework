name: Self-Healing Framework CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  self-healing-test:
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout Framework2
      - name: Checkout Framework2
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }} # Required to push auto-repaired code back

      # 2. Setup Java 21 & Authenticate Maven for Private Plugin
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: github # Matches the repository ID in your pom.xml
          server-username: GITHUB_ACTOR
          server-password: PLUGIN_REPO_TOKEN

      # 3. Setup Chrome
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 4. Verify Environment
      - name: Verify Environment
        run: |
          java -version
          mvn -version
          google-chrome --version

      # 5. Run ONLY the healing test (Maven downloads the compiled plugin securely)
      - name: Run Self-Healing Login Test
        env:
          PLUGIN_REPO_TOKEN: ${{ secrets.PLUGIN_REPO_TOKEN }}
        run: |
          mvn --batch-mode clean test \
            -Dtest=LoginTest \
            -Dheadless=true \
            -Dai.enabled=false

      # 6. Auto-Commit Healed Page Objects
      - name: Commit and Push Healed Page Objects
        if: always()
        run: |
          git config --global user.name "Healing-Bot"
          git config --global user.email "bot@selfhealing.com"
          
          # Stage the modified Page Objects
          git add src/main/java/pages/*.java
          
          # Check for changes and commit
          if ! git diff-index --quiet HEAD; then
            git commit -m "Auto-repair: AI self-healing updated Page Objects"
            git push
          else
            echo "No Page Objects required healing."
          fi

      # 7. Upload healing reports
      - name: Upload Healing Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-reports
          path: |
            reports/
            target/surefire-reports/
          if-no-files-found: ignore

      # 8. Upload execution logs
      - name: Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: |
            *.log
            target/*.log
          if-no-files-found: ignore
