name: Self-Healing Framework CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  self-healing-test:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Framework2
      - name: Checkout Framework2
        uses: actions/checkout@v4

      # 2. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 3. Setup Chrome
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 4. Verify Java and Chrome
      - name: Verify Environment
        run: |
          java -version
          mvn -version
          google-chrome --version

      # 5. Run ONLY the healing test
      - name: Run Self-Healing Login Test
        run: |
          mvn clean test \
            -Dtest=LoginTest \
            -Dheadless=true \
            -Dai.enabled=false

      # 6. Upload healing reports even if test fails
      - name: Upload Healing Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-reports
          path: |
            reports/
            target/surefire-reports/
          if-no-files-found: ignore

      # 7. Upload logs if generated
      - name: Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: |
            *.log
            target/*.log
          if-no-files-found: ignore