name: Self-Healing Framework CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  self-healing-test:

    runs-on: ubuntu-latest

    steps:

      # 1. Checkout Framework2
      - name: Checkout Framework2
        uses: actions/checkout@v4

      # 2. Checkout private Self-Healing Plugin
      - name: Checkout Self-Healing Plugin
        uses: actions/checkout@v4
        with:
          repository: Vinayakkkk/Self-Healing-Plugin
          ref: main
          token: ${{ secrets.PLUGIN_REPO_TOKEN }}
          path: self-healing-plugin

      # 3. Setup Java 21
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 4. Build and install Self-Healing Plugin
      - name: Build Self-Healing Plugin
        working-directory: self-healing-plugin
        run: |
          mvn --batch-mode clean install -DskipTests

      # 5. Setup Chrome
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      # 6. Verify Environment
      - name: Verify Environment
        run: |
          java -version
          mvn -version
          google-chrome --version

      # 7. Run ONLY the healing test
      - name: Run Self-Healing Login Test
        run: |
          mvn --batch-mode clean test \
            -Dtest=LoginTest \
            -Dheadless=true \
            -Dai.enabled=false

      # 8. Upload healing reports
      - name: Upload Healing Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: healing-reports
          path: |
            reports/
            target/surefire-reports/
          if-no-files-found: ignore

      # 9. Upload execution logs
      - name: Upload Execution Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: execution-logs
          path: |
            *.log
            target/*.log
          if-no-files-found: ignore
