To use Ollama:
ai.provider=ollama
ai.model=qwen3:8b
healing.report.enabled=true
healing.dashboard.enabled=true
healing.report.dir=./reports
healing.source.repair.enabled=true

# To switch to OpenRouter later, just change the provider and add your key:
# ai.provider=openrouter
# ai.openrouter.model=openrouter/free

